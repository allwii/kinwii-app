name: kinwii
description: "AI-powered intentional living planner"
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  dio: ^5.6.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  google_fonts: 6.3.3
  flutter_dotenv: ^5.1.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  google_sign_in: ^7.2.0
  purchases_flutter: ^10.0.0
  purchases_ui_flutter: ^10.0.0
  uuid: ^4.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
